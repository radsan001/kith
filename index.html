<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <title>Kith – Smart Home Organizer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #f4f0ec;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      padding: 16px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* main app container – responsive width */
    .kith-app {
      max-width: 500px;
      width: 100%;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 48px;
      box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      transition: all 0.2s;
    }

    /* header */
    .kith-header {
      background: linear-gradient(135deg, #2c3e50, #3a6b5e);
      padding: 28px 24px 32px;
      color: white;
    }
    .kith-header h1 {
      font-size: clamp(1.8rem, 7vw, 2.2rem);
      font-weight: 700;
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
    }
    .kith-header h1 span {
      background: rgba(255,255,240,0.2);
      padding: 4px 12px;
      border-radius: 60px;
      font-size: 0.8rem;
      font-weight: 400;
    }
    .kith-header p {
      font-size: 0.85rem;
      opacity: 0.85;
      margin-top: 10px;
    }

    /* smart command bar */
    .smart-bar {
      background: white;
      margin: -20px 16px 0 16px;
      padding: 6px;
      border-radius: 60px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.08);
      display: flex;
      gap: 8px;
      backdrop-filter: blur(4px);
    }
    .smart-bar input {
      flex: 1;
      border: none;
      padding: 14px 18px;
      font-size: 0.95rem;
      border-radius: 60px;
      outline: none;
      background: #fefaf7;
      font-family: inherit;
    }
    .smart-bar button {
      background: #2c3e50;
      border: none;
      padding: 0 24px;
      border-radius: 60px;
      color: white;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.2s;
      white-space: nowrap;
    }
    .smart-bar button:active {
      transform: scale(0.96);
    }

    /* bottom navigation – responsive */
    .kith-nav {
      display: flex;
      background: #ffffffcc;
      backdrop-filter: blur(20px);
      border-top: 0.5px solid #e9e2dc;
      padding: 8px 12px 12px;
      gap: 6px;
    }
    .nav-btn {
      flex: 1;
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 0.7rem;
      font-weight: 500;
      color: #8b7a6b;
      padding: 8px 0;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.1s;
    }
    .nav-btn span:first-child {
      font-size: 1.6rem;
    }
    .nav-btn.active {
      background: #f0e7e0;
      color: #2c3e50;
      font-weight: 600;
    }

    /* content panels */
    .panel {
      display: none;
      padding: 24px 20px 32px;
      background: white;
      animation: fadeSlide 0.2s ease;
    }
    .panel.active-panel {
      display: block;
    }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(6px);}
      to { opacity: 1; transform: translateY(0);}
    }

    .section-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #2c3e50;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* manual add row */
    .add-row {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      background: #faf7f4;
      border-radius: 60px;
      padding: 4px;
    }
    .add-row input {
      flex: 1;
      border: none;
      background: transparent;
      padding: 12px 16px;
      font-size: 0.9rem;
      outline: none;
      font-family: inherit;
    }
    .add-row button {
      background: #2c3e50;
      border: none;
      padding: 0 20px;
      border-radius: 60px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    /* list items */
    .list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: white;
      border: 1px solid #f0e6df;
      border-radius: 60px;
      padding: 8px 16px;
      margin-bottom: 10px;
    }
    .task-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }
    .task-left input[type="checkbox"] {
      width: 22px;
      height: 22px;
      accent-color: #3a6b5e;
      cursor: pointer;
    }
    .completed-text {
      text-decoration: line-through;
      color: #b9a99a;
    }
    .delete-btn {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: #cfbfb0;
      padding: 6px;
      border-radius: 40px;
    }
    .delete-btn:active {
      background: #f0e6df;
    }

    /* calendar */
    .cal-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f9f4ef;
      padding: 8px 16px;
      border-radius: 60px;
      margin-bottom: 20px;
    }
    .cal-month {
      font-weight: 700;
      color: #2c3e50;
    }
    .cal-btn {
      background: white;
      border: none;
      padding: 6px 16px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      margin-bottom: 20px;
    }
    .weekday {
      text-align: center;
      font-size: 0.7rem;
      font-weight: 600;
      color: #9b8c7c;
      padding: 6px 0;
    }
    .cal-day {
      background: #fefcf9;
      border-radius: 40px;
      text-align: center;
      padding: 10px 0;
      font-size: 0.8rem;
      font-weight: 500;
      color: #3a2c21;
      cursor: pointer;
      border: 1px solid #f0e6df;
      transition: 0.05s linear;
    }
    .cal-day:active {
      background: #e9e0d9;
    }
    .cal-day.has-event {
      background: #e2f0f2;
      border-color: #3a6b5e;
      color: #1e555f;
      font-weight: 700;
    }
    .cal-day.today {
      background: #ffe8d9;
      border: 2px solid #e67e22;
    }
    .event-list-card {
      background: #fefaf7;
      border-radius: 28px;
      padding: 14px;
      margin-top: 12px;
    }
    .event-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #f0e2d8;
    }
    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: #aa9b8b;
      font-size: 0.85rem;
    }

    /* toast message */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 16px;
      right: 16px;
      max-width: 360px;
      margin: 0 auto;
      background: #1e2a32;
      color: white;
      text-align: center;
      padding: 12px 20px;
      border-radius: 60px;
      font-size: 0.85rem;
      z-index: 1000;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      animation: fadeUp 0.2s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px);}
      to { opacity: 1; transform: translateY(0);}
    }

    /* responsive adjustments for tablets and landscape */
    @media (min-width: 768px) {
      body {
        padding: 32px;
      }
      .kith-app {
        max-width: 650px;
      }
      .smart-bar input {
        font-size: 1rem;
      }
      .calendar-grid {
        gap: 10px;
      }
      .cal-day {
        padding: 12px 0;
        font-size: 0.9rem;
      }
    }

    @media (min-width: 1024px) {
      .kith-app {
        max-width: 700px;
      }
    }

    /* touch-friendly */
    button, .nav-btn, .cal-day, .delete-btn, .add-row button {
      cursor: pointer;
      touch-action: manipulation;
    }

    /* fix for very small devices */
    @media (max-width: 420px) {
      .kith-header {
        padding: 20px 18px 24px;
      }
      .panel {
        padding: 18px 16px 24px;
      }
      .section-title {
        font-size: 1.2rem;
      }
      .add-row input, .smart-bar input {
        font-size: 0.85rem;
        padding: 10px 14px;
      }
      .nav-btn span:first-child {
        font-size: 1.3rem;
      }
      .nav-btn span:last-child {
        font-size: 0.65rem;
      }
    }
  </style>
</head>
<body>
<div class="kith-app">
  <div class="kith-header">
    <h1>Kith <span>home</span></h1>
    <p>smart shopping, tasks & calendar — one command</p>
  </div>

  <div class="smart-bar">
    <input type="text" id="smartInput" placeholder="e.g., buy milk, task call mom, meeting on june 20" autocomplete="off">
    <button id="smartExec">→</button>
  </div>

  <!-- panels -->
  <div id="shoppingPanel" class="panel active-panel">
    <div class="section-title">🛍️ Shopping</div>
    <div class="add-row">
      <input type="text" id="manualShop" placeholder="item name">
      <button id="addShopBtn">+ Add</button>
    </div>
    <div id="shoppingList"></div>
  </div>

  <div id="tasksPanel" class="panel">
    <div class="section-title">✅ Tasks</div>
    <div class="add-row">
      <input type="text" id="manualTask" placeholder="task description">
      <button id="addTaskBtn">+ Add</button>
    </div>
    <div id="tasksList"></div>
  </div>

  <div id="calendarPanel" class="panel">
    <div class="section-title">📅 Calendar</div>
    <div id="calendarWidget"></div>
    <div class="add-row" style="margin-top: 6px;">
      <input type="text" id="eventTitle" placeholder="Event name">
      <input type="date" id="eventDate" style="border-radius: 60px; background:#faf7f4; border:none; padding: 0 12px; font-family: inherit;">
      <button id="addEventBtn">+</button>
    </div>
    <div id="dayEvents"></div>
  </div>

  <div class="kith-nav">
    <button class="nav-btn active" data-nav="shopping"><span>🛒</span><span>Shop</span></button>
    <button class="nav-btn" data-nav="tasks"><span>✅</span><span>Tasks</span></button>
    <button class="nav-btn" data-nav="calendar"><span>📅</span><span>Plan</span></button>
  </div>
</div>

<script>
  // ---------- DATA ----------
  let shopping = [];
  let tasks = [];      // { text, completed }
  let events = [];     // { id, title, date (YYYY-MM-DD) }

  function loadData() {
    const s = localStorage.getItem('kith_shopping');
    if (s) shopping = JSON.parse(s);
    const t = localStorage.getItem('kith_tasks');
    if (t) tasks = JSON.parse(t);
    const e = localStorage.getItem('kith_events');
    if (e) events = JSON.parse(e);
  }
  function saveShop() { localStorage.setItem('kith_shopping', JSON.stringify(shopping)); }
  function saveTasks() { localStorage.setItem('kith_tasks', JSON.stringify(tasks)); }
  function saveEvents() { localStorage.setItem('kith_events', JSON.stringify(events)); }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  // RENDER SHOPPING
  function renderShopping() {
    const container = document.getElementById('shoppingList');
    if (!container) return;
    if (shopping.length === 0) {
      container.innerHTML = '<div class="empty-state">✨ Nothing yet. Add via smart bar or + button.</div>';
      return;
    }
    container.innerHTML = shopping.map((item, idx) => `
      <div class="list-item">
        <span>${escapeHtml(item)}</span>
        <button class="delete-btn" data-shop-idx="${idx}">🗑️</button>
      </div>
    `).join('');
    document.querySelectorAll('[data-shop-idx]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const idx = parseInt(btn.getAttribute('data-shop-idx'));
        shopping.splice(idx, 1);
        saveShop();
        renderShopping();
      });
    });
  }

  // RENDER TASKS
  function renderTasks() {
    const container = document.getElementById('tasksList');
    if (!container) return;
    if (tasks.length === 0) {
      container.innerHTML = '<div class="empty-state">📌 No tasks. Add something to do.</div>';
      return;
    }
    container.innerHTML = tasks.map((t, idx) => `
      <div class="list-item">
        <div class="task-left">
          <input type="checkbox" data-task-idx="${idx}" ${t.completed ? 'checked' : ''}>
          <span class="${t.completed ? 'completed-text' : ''}">${escapeHtml(t.text)}</span>
        </div>
        <button class="delete-btn" data-task-del="${idx}">🗑️</button>
      </div>
    `).join('');
    document.querySelectorAll('[data-task-idx]').forEach(cb => {
      cb.addEventListener('change', (e) => {
        const idx = parseInt(cb.getAttribute('data-task-idx'));
        tasks[idx].completed = cb.checked;
        saveTasks();
        renderTasks();
      });
    });
    document.querySelectorAll('[data-task-del]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const idx = parseInt(btn.getAttribute('data-task-del'));
        tasks.splice(idx, 1);
        saveTasks();
        renderTasks();
      });
    });
  }

  // CALENDAR
  let currentCalendar = new Date();

  function renderCalendar() {
    const year = currentCalendar.getFullYear();
    const month = currentCalendar.getMonth();
    const firstDay = new Date(year, month, 1);
    const startWeekday = firstDay.getDay();
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const today = new Date();
    const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

    let html = `<div class="cal-controls">
      <button class="cal-btn" id="prevMonthBtn">◀ Prev</button>
      <span class="cal-month">${firstDay.toLocaleString('default', { month: 'long' })} ${year}</span>
      <button class="cal-btn" id="nextMonthBtn">Next ▶</button>
    </div>
    <div class="calendar-grid">`;
    const weekdays = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
    weekdays.forEach(d => html += `<div class="weekday">${d}</div>`);
    for (let i=0; i<startWeekday; i++) html += `<div class="cal-day"></div>`;
    for (let d=1; d<=daysInMonth; d++) {
      const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const hasEvent = events.some(ev => ev.date === dateStr);
      const isToday = dateStr === todayStr;
      let cls = 'cal-day';
      if (hasEvent) cls += ' has-event';
      if (isToday) cls += ' today';
      html += `<div class="${cls}" data-cal-date="${dateStr}"><strong>${d}</strong>${hasEvent ? ' ⚡' : ''}</div>`;
    }
    html += `</div>`;
    document.getElementById('calendarWidget').innerHTML = html;

    document.querySelectorAll('[data-cal-date]').forEach(el => {
      el.addEventListener('click', () => showDayEvents(el.getAttribute('data-cal-date')));
    });
    document.getElementById('prevMonthBtn')?.addEventListener('click', () => {
      currentCalendar.setMonth(currentCalendar.getMonth()-1);
      renderCalendar();
    });
    document.getElementById('nextMonthBtn')?.addEventListener('click', () => {
      currentCalendar.setMonth(currentCalendar.getMonth()+1);
      renderCalendar();
    });
    showDayEvents(todayStr);
  }

  function showDayEvents(dateStr) {
    const dayEvents = events.filter(ev => ev.date === dateStr);
    const container = document.getElementById('dayEvents');
    if (dayEvents.length === 0) {
      container.innerHTML = `<div class="event-list-card">📅 ${dateStr}<br><span style="color:#b9a99a;">No events</span></div>`;
      return;
    }
    let inner = `<div class="event-list-card"><strong>📌 ${dateStr}</strong><ul style="list-style:none; margin-top:8px;">`;
    dayEvents.forEach(ev => {
      inner += `<li class="event-item">📝 ${escapeHtml(ev.title)} <button class="delete-btn" data-event-id="${ev.id}" style="font-size:1rem;">❌</button></li>`;
    });
    inner += `</ul></div>`;
    container.innerHTML = inner;
    document.querySelectorAll('[data-event-id]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const id = btn.getAttribute('data-event-id');
        events = events.filter(ev => ev.id !== id);
        saveEvents();
        renderCalendar();
      });
    });
  }

  function addEvent(title, date) {
    if (!title || !date) return false;
    events.push({ id: Date.now()+Math.random(), title: title.trim(), date: date });
    saveEvents();
    renderCalendar();
    return true;
  }

  // SMART PARSER (text only)
  function parseCommand(raw) {
    raw = raw.trim();
    if (raw === "") return "Empty command";
    const lower = raw.toLowerCase();
    // shopping
    if (lower.match(/^(buy|get|add)\s+/) && !lower.includes('task') && !lower.includes('event') && !lower.includes('on ')) {
      let item = raw.replace(/^(buy|get|add)\s+/i, '').trim();
      if (item) {
        shopping.push(item);
        saveShop();
        renderShopping();
        return `🛒 Added "${item}" to shopping`;
      }
    }
    // task
    if (lower.match(/^(task|todo|remind me to)\s+/i)) {
      let taskText = raw.replace(/^(task|todo|remind me to)\s+/i, '').trim();
      if (taskText) {
        tasks.push({ text: taskText, completed: false });
        saveTasks();
        renderTasks();
        return `✅ Task added: "${taskText}"`;
      }
    }
    // calendar event with date
    let dateMatch = raw.match(/\b(\d{4}-\d{2}-\d{2})\b/) || raw.match(/on\s+(\w+\s+\d{1,2})/i);
    if (dateMatch) {
      let title = raw.replace(/\bon\s+(\d{4}-\d{2}-\d{2}|\w+\s+\d{1,2})/i, '').trim();
      if (!title) title = "Reminder";
      let parsedDate = null;
      if (dateMatch[1] && dateMatch[1].match(/\d{4}-\d{2}-\d{2}/)) parsedDate = dateMatch[1];
      else if (dateMatch[1]) {
        let parts = dateMatch[1].split(' ');
        if (parts.length === 2) {
          const months = {jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
          let monthName = parts[0].toLowerCase().slice(0,3);
          let day = parseInt(parts[1]);
          let year = new Date().getFullYear();
          if (months[monthName] !== undefined && day>=1 && day<=31) {
            let d = new Date(year, months[monthName], day);
            if (d.getMonth() === months[monthName]) {
              parsedDate = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            }
          }
        }
      }
      if (parsedDate) {
        addEvent(title, parsedDate);
        return `📅 Event "${title}" on ${parsedDate}`;
      }
    }
    // fallback to shopping
    shopping.push(raw);
    saveShop();
    renderShopping();
    return `🛒 Added "${raw}" to shopping (default)`;
  }

  function showToast(msg) {
    let toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = msg;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2500);
  }

  function onSmartCommand() {
    const input = document.getElementById('smartInput');
    const cmd = input.value;
    if (!cmd.trim()) return;
    const result = parseCommand(cmd);
    showToast(result);
    input.value = '';
    if (result.includes('🛒')) switchPanel('shopping');
    else if (result.includes('✅')) switchPanel('tasks');
    else if (result.includes('📅')) switchPanel('calendar');
  }

  // manual handlers
  document.getElementById('addShopBtn')?.addEventListener('click', () => {
    const val = document.getElementById('manualShop').value.trim();
    if (val) { shopping.push(val); saveShop(); renderShopping(); document.getElementById('manualShop').value = ''; showToast(`🛒 Added ${val}`); }
  });
  document.getElementById('addTaskBtn')?.addEventListener('click', () => {
    const val = document.getElementById('manualTask').value.trim();
    if (val) { tasks.push({ text: val, completed: false }); saveTasks(); renderTasks(); document.getElementById('manualTask').value = ''; showToast(`✅ Task added`); }
  });
  document.getElementById('addEventBtn')?.addEventListener('click', () => {
    const title = document.getElementById('eventTitle').value.trim();
    const date = document.getElementById('eventDate').value;
    if (title && date) { addEvent(title, date); document.getElementById('eventTitle').value = ''; document.getElementById('eventDate').value = ''; showToast(`📅 Event added`); }
    else showToast("Fill both fields");
  });
  document.getElementById('smartExec')?.addEventListener('click', onSmartCommand);
  document.getElementById('smartInput')?.addEventListener('keypress', (e) => { if(e.key === 'Enter') onSmartCommand(); });

  // navigation
  function switchPanel(panelId) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active-panel'));
    document.getElementById(`${panelId}Panel`).classList.add('active-panel');
    document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelector(`.nav-btn[data-nav="${panelId}"]`).classList.add('active');
    if (panelId === 'calendar') renderCalendar();
  }
  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => switchPanel(btn.getAttribute('data-nav')));
  });

  // init
  loadData();
  renderShopping();
  renderTasks();
  renderCalendar();
  switchPanel('shopping');
</script>
</body>
</html>
